<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sluqecu Metropolis Map</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <style>
        @font-face {
            font-family: 'La';
            src: url('font/Pretendard-Regular.otf') format('opentype');
            font-weight: normal;
            font-style: normal;
        }

        @font-face {
            font-family: 'Hz';
            src: url('font/NotoSansSC-Regular.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        @font-face {
            font-family: 'Rm';
            src: url('font/RusimezSans.otf') format('opentype');
            font-weight: normal;
            font-style: normal;
        }

        body { margin: 0; padding: 0; }
        #map { width: 100vw; height: 100vh; }

        .map-label {
            background: transparent;
            border: none;
            box-shadow: none;
            color: #cccccc;
            white-space: nowrap;
            text-align: center;
            text-shadow: 
                0.25vh 0 0 #222222,
                0.24vh 0.07vh 0 #222222,
                0.20vh 0.15vh 0 #222222,
                0.15vh 0.20vh 0 #222222,
                0.07vh 0.24vh 0 #222222,
                0 0.25vh 0 #222222,
                -0.07vh 0.24vh 0 #222222,
                -0.15vh 0.20vh 0 #222222,
                -0.20vh 0.15vh 0 #222222,
                -0.24vh 0.07vh 0 #222222,
                -0.25vh 0 0 #222222,
                -0.24vh -0.07vh 0 #222222,
                -0.20vh -0.15vh 0 #222222,
                -0.15vh -0.20vh 0 #222222,
                -0.07vh -0.24vh 0 #222222,
                0 -0.25vh 0 #222222,
                0.07vh -0.24vh 0 #222222,
                0.15vh -0.20vh 0 #222222,
                0.20vh -0.15vh 0 #222222,
                0.24vh -0.07vh 0 #222222;
            white-space: nowrap;
        }

        .map-label-row {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            height: 100%;
            text-align: left;
        }

        .map-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            margin-right: 4px;
        }

        .map-icon svg {
            width: 100%;
            height: 100%;
            display: block;
        }
        
        #custom-controls {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 10px;
        }

        .lang-group {
            display: flex;
            gap: 5px;
        }

        .control-btn {
            font-size: 2vh;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px) saturate(160%);
            -webkit-backdrop-filter: blur(12px) saturate(160%);
            border: 1px solid rgba(255, 255, 255, 0.18);
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.2), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            color: #ffffff;
            padding: 1vh 2vh;
            border-radius: 4vh;
            cursor: pointer;
            transition: background 0.2s ease, border-color 0.2s ease;
        }

        .control-btn:hover {
            background: rgba(255, 255, 255, 0.16);
        }

        .control-btn.active {
            background: rgba(255, 255, 255, 0.35);
            border: 1px solid rgba(255, 255, 255, 0.6);
            color: #ffffff;
        }

        body.lang-lo, .lang-lo .map-label {
            font-family: 'Hz', 'Rm', sans-serif;
        }

        body.lang-en, .lang-en .map-label {
            font-family: 'La', sans-serif;
        }

    </style>
</head>
<body>
    <div id="custom-controls">
        <div class="lang-group">
            <button class="control-btn active" onclick="changeLang('lo', this)" style="font-family: 'Hz', sans-serif;">联邦語</button>
            <button class="control-btn" onclick="changeLang('en', this)">English</button>
        </div>
    </div>
    <div id="map"></div>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="script.js"></script>
</body>
</html>
