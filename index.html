<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sluqecu Metropolis Map</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <style>
        /* 1. 로컬 폰트 파일 등록 */
        @font-face {
            font-family: 'La';
            src: url('font/Pretendard-RegularPretendard-Regular.otf') format('opentype');
            font-weight: normal;
            font-style: normal;
        }

        @font-face {
            font-family: 'Hz';
            src: url('font/NotoSansSC-Regular.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        @font-face {
            font-family: 'Rm';
            src: url('font/RusimezSans.otf') format('opentype');
            font-weight: normal;
            font-style: normal;
        }

        body {
            margin: 0;
            padding: 0;
        }

        body { margin: 0; padding: 0; }
        #map { width: 100vw; height: 100vh; background-color: #f0f0f0; }

        /* 2. 지도 라벨에 폰트 적용 */
        .map-label {
            background: transparent;
            border: none;
            box-shadow: none;
            color: #cccccc;
            white-space: nowrap;
            text-align: center;
            text-shadow: 
                -1px -1px 0 #222222,
                1px -1px 0 #222222,
                -1px  1px 0 #222222,
                1px  1px 0 #222222,
                -1px  0   0 #222222,
                1px  0   0 #222222,
                0   -1px 0 #222222,
                0    1px 0 #222222;
            white-space: nowrap;
        }

        /* 2-1. 아이콘 + 텍스트 가로 배치 (d, e 위계에서 icon이 지정된 경우) */
        .map-label-row {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            height: 100%;
            text-align: left;
        }

        .map-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            margin-right: 4px;
        }

        .map-icon svg {
            width: 100%;
            height: 100%;
            display: block;
        }
        
        /* UI 컨테이너 (오른쪽 상단) */
        #custom-controls {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            align-items: flex-end; /* 오른쪽 정렬 */
            gap: 10px;
        }

        /* 언어 버튼 그룹 */
        .lang-group {
            display: flex;
            gap: 5px;
        }

        /* 공통 버튼 스타일 */
        .control-btn {
            font-family: 'La' sans-serif;
            background: #cccccc;
            border: 1px solid #222222;
            padding: 8px 12px;
            cursor: pointer;
            font-size: 14px;
            border-radius: 14px;
        }

        .control-btn:hover { background: #ffffff; }
        .control-btn.active { background: #ffffff; }

        /* 1. 로포나어  */
        body.lang-lo, .lang-lo .map-label {
            font-family: 'Hz', 'Rm', sans-serif;
        }

        /* 2. 한국어 및 영어 */
        body.lang-en, .lang-en .map-label {
            font-family: 'La', sans-serif;
        }

    </style>
</head>
<body>
    <div id="custom-controls">
        <div class="lang-group">
            <button class="control-btn active" onclick="changeLang('lo', this)" style="font-family: 'Hz', sans-serif;">联邦語</button>
            <button class="control-btn" onclick="changeLang('en', this)">English</button>
        </div>
    </div>
    <div id="map"></div>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="script.js"></script>
</body>
</html>
