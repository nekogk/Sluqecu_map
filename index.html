<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sluqecu Metropolis Map</title>
    <link rel="shortcut icon" href="#">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="custom-controls">
        <div class="toggle-group">
            <button id="lang-toggle" class="control-btn" onclick="toggleLang(this)" aria-label="Toggle language">
                <img src="icons/language.svg" class="btn-icon" alt="">
            </button>
            <button id="transit-toggle" class="control-btn" onclick="toggleTransit(this)" aria-label="Toggle transit layer">
                <img src="icons/directions.svg" class="btn-icon" alt="">
            </button>
            <button id="land-toggle" class="control-btn" onclick="toggleLand(this)" aria-label="Toggle land layer">
                <img src="icons/layers.svg" class="btn-icon" alt="">
            </button>
        </div>
    </div>
    <div id="map"></div>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="script.js"></script>
</body>
</html>
